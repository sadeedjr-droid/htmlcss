<!--the <header>tag defines the introductory section of a webpage or a particular section of a content. 
    The <nav> tag defines a section containing important navigation links.
        Navigations means moving from one page to another.

        examples
        -home
        -about
        -contact
        -services
        -login

    The <main> tag  represents the primary content of a webpage.
        It contains the most important information that is directly related to the purpose of the page.
        for example, in a student website:
        -student profile
        -student registration
        -latest updates

    The <footer> tag defines the footer section of a webpage or a particular section of content.
